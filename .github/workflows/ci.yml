name: DevOps Lab Exercise
run-name: ${{ github.actor }} is testing out GitHub Actions 🚀
# Controls when the workflow will run
on: 
  # Triggers the workflow on push or pull request events
  # but only for the "main" branch
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v3
        with: 
          node-version: '20.x'
      #- run: npm ci
      - run: npm run build --if-present
      - run: npm test

name: Deploy React App
on:
  pull_request:
    branches: ["main"] 
  jobs:
    build:
      runs-on: ubuntu-latest

      steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.x' #Use the approproate Node.js version for our project

      - name: Install dependencies:
        run: npm install

      - name: Build the app
        run: npm run build
      
      - name: Run test
        run: npm run test
      
      - name: Deploy to GitHub Pages
        run: npm run deploy
        env:
          GITHUB_TOKEN: ${{secrets.COMP3104_TOKEN}}